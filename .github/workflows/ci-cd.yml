name: CI/CD Phoenix Orders

on:
  push:
    branches: [ main, tonys, "*/dev" ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/tony007-infor/jamac-backend

jobs:
  # ==========================================
  # 1: AUDITORÍA DE SEGURIDAD (ESTÁTICA)
  # ==========================================
  security-audit:
    name: DevSecOps - Linter & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Hadolint: Linter para el Dockerfile
      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # 2. Trivy Secrets: Escaneo de credenciales en el código fuente
      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          skip-dirs: 'vendor'
          exit-code: '1'

  # ==========================================
  #  2: PRUEBAS AUTOMATIZADAS (PHPUnit)
  # ==========================================
  build-and-test:
    name: Build y Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: phoenix_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, gd, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env para pruebas
        run: cp .env.example .env

      - name: Generar Application Key
        run: php artisan key:generate

      - name: Ajustar credenciales de test al contenedor de CI
        run: |
          sed -i 's/<env name="DB_DATABASE" value="[^"]*"\/>/<env name="DB_DATABASE" value="phoenix_ci_db"\/>/' phpunit.xml
          sed -i 's/<env name="DB_USERNAME" value="[^"]*"\/>/<env name="DB_USERNAME" value="postgres"\/>/' phpunit.xml
          sed -i 's/<env name="DB_PASSWORD" value="[^"]*"\/>/<env name="DB_PASSWORD" value="ci_test_password"\/>/' phpunit.xml

      - name: Ejecutar pruebas automatizadas
        run: vendor/bin/phpunit

  # ==========================================
  # 3: CONSTRUCCIÓN, ESCANEO Y PUSH DE IMAGEN
  # ==========================================
  build-and-push-image:
    name: Build y Push de Imagen Docker
    needs: [security-audit, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compilar la imagen localmente para poder escanearla antes de publicar
      - name: Build local de la imagen para análisis
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha

      # 3. Trivy Image: Escaneo de vulnerabilidades en la imagen Docker
      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:temp-scan'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 4. Syft: Generación de SBOM
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:temp-scan'
          format: 'spdx-json'
          output-file: 'sbom.json'

      - name: Subir SBOM como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-manifest
          path: sbom.json

      # Push final a GitHub Container Registry si todas las pruebas pasaron
      - name: Push de la imagen a GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # ==========================================
  # 4: APROVISIONAMIENTO DE INFRAESTRUCTURA (IaC)
  # ==========================================
  provision-infra:
    name: Provisionar Servidor (Terraform)
    needs: [security-audit, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    outputs:
      public_ip: ${{ steps.tf-output.outputs.public_ip }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=backend/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
              -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Exportar IP publica
        id: tf-output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  # ==========================================
  # 5: DESPLIEGUE A EC2
  # ==========================================        
  deploy-production:
    name: Despliegue a Producción (EC2)
    needs: [build-and-push-image, provision-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Esperar a que el servidor este listo (SSH)
        run: |
          echo "Esperando que ${{ needs.provision-infra.outputs.public_ip }} responda en el puerto 22..."
          for i in $(seq 1 20); do
            if nc -z -w3 ${{ needs.provision-infra.outputs.public_ip }} 22; then
              echo "SSH listo."
              break
            fi
            echo "Intento $i/20, esperando 10s..."
            sleep 10
          done

      - name: Preparar archivo .env
        run: echo "${{ secrets.BACKEND_ENV_FILE }}" > backend.env

      - name: Copiar .env al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.provision-infra.outputs.public_ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend.env"
          target: "/tmp/"

      - name: Copiar carpeta kubernetes al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.provision-infra.outputs.public_ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "kubernetes/"
          target: "/home/${{ secrets.SERVER_USER }}/"

      - name: Desplegar en Kubernetes (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision-infra.outputs.public_ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Esperando a que cloud-init termine de configurar el servidor..."
            sudo cloud-init status --wait

            echo "Configurando variables de entorno..."
            sudo mkdir -p /var/www/backend
            sudo mv /tmp/backend.env /var/www/backend/.env
            sudo chown $USER:$USER /var/www/backend/.env
            sudo chmod 600 /var/www/backend/.env

            echo "Creando/Actualizando secreto de Kubernetes para las variables de entorno..."
            kubectl create secret generic backend-env --from-env-file=/var/www/backend/.env --dry-run=client -o yaml | kubectl apply -f -

            echo "Aplicando manifiestos de Kubernetes..."
            kubectl apply -f kubernetes/backend-deployment.yaml
            kubectl apply -f kubernetes/backend-service.yaml

            echo "Reiniciando el despliegue del backend para forzar la carga de las nuevas variables..."
            kubectl rollout restart deployment/jamac-backend

            echo "Esperando a que el despliegue de Kubernetes esté listo..."
            kubectl rollout status deployment/jamac-backend --timeout=180s

            echo "Corriendo migraciones y actualizando documentación de Swagger en Kubernetes..."
            POD_NAME=$(kubectl get pods -l app=jamac-backend -o jsonpath="{.items[0].metadata.name}")
            kubectl exec $POD_NAME -- php artisan migrate --force
            kubectl exec $POD_NAME -- php artisan optimize:clear
            kubectl exec $POD_NAME -- php artisan l5-swagger:generate

            echo "✅ Despliegue con Kubernetes completado exitosamente"

